<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ガチャガチャ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2d42;
    --bg:#fff4e6;
    --dot:#ffd8b0;
    --red:#ff4d5e;
    --red-dark:#d93648;
    --yellow:#ffd23f;
    --card:#ffffff;
    --muted:#7a7c92;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;min-height:100%}
  body{
    font-family:'M PLUS Rounded 1c',system-ui,sans-serif;
    color:var(--ink);
    background-color:var(--bg);
    background-image:radial-gradient(var(--dot) 1.5px,transparent 1.6px);
    background-size:22px 22px;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  button{font:inherit;color:inherit}

  .app{max-width:980px;margin:0 auto;padding:16px 16px 40px;display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:start}
  header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{margin:0;font-weight:900;font-size:clamp(24px,5vw,34px);letter-spacing:.5px;line-height:1}
  h1 small{display:block;font-size:13px;font-weight:800;color:var(--red);letter-spacing:3px;margin-top:4px}
  .icon-btn{width:46px;height:46px;border-radius:14px;border:3px solid var(--ink);background:var(--card);font-size:20px;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
  .icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

  /* ---------- Machine ---------- */
  .play{display:flex;flex-direction:column;align-items:center;gap:16px}
  .machine{position:relative;width:320px}
  .dome{
    position:relative;z-index:2;width:300px;height:300px;margin:0 auto;border-radius:50%;
    border:5px solid var(--ink);overflow:hidden;
    background:linear-gradient(180deg,rgba(225,243,255,.85),rgba(190,226,255,.75));
    box-shadow:inset 0 0 0 6px rgba(255,255,255,.75),inset -20px -26px 40px rgba(70,130,200,.25);
  }
  .glass{position:absolute;inset:0;pointer-events:none;z-index:5;border-radius:50%}
  .glass::before{content:"";position:absolute;left:34px;top:30px;width:90px;height:150px;border-radius:50%;
    border-left:10px solid rgba(255,255,255,.85);transform:rotate(22deg);filter:blur(.5px)}
  .glass::after{content:"";position:absolute;left:150px;top:26px;width:26px;height:14px;border-radius:50%;background:rgba(255,255,255,.8);transform:rotate(18deg)}
  .collar{position:relative;z-index:3;width:220px;height:28px;margin:-20px auto 0;background:var(--yellow);border:5px solid var(--ink);border-radius:12px}
  .body{
    position:relative;z-index:1;width:320px;height:290px;margin:-8px auto 0;
    background:linear-gradient(180deg,var(--red),var(--red-dark));
    border:5px solid var(--ink);border-radius:26px 26px 22px 22px;
    box-shadow:inset 0 6px 0 rgba(255,255,255,.25),inset 0 -10px 0 rgba(0,0,0,.12),0 10px 0 var(--ink);
  }
  .feet{width:260px;height:18px;margin:6px auto 0;border-radius:50%;background:rgba(43,45,66,.18)}

  .marquee{position:absolute;left:14px;right:14px;top:14px;height:56px;border-radius:14px;background:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
  .marquee b{font-weight:900;font-size:22px;color:var(--yellow);letter-spacing:2px;line-height:1}
  .marquee span{font-size:10px;font-weight:800;color:#fff;letter-spacing:2px;margin-top:4px;opacity:.85}
  .bulbs{position:absolute;left:8px;right:8px;display:flex;justify-content:space-between}
  .bulbs.t{top:4px}.bulbs.b{bottom:4px}
  .bulb{width:6px;height:6px;border-radius:50%;background:#7a5a1a;animation:bulb 1.2s steps(1) infinite;animation-delay:calc(var(--i) * -.15s)}
  @keyframes bulb{0%{background:#fff3b0;box-shadow:0 0 6px #ffe066}50%{background:#7a5a1a;box-shadow:none}}
  .machine.hot .bulb{animation-duration:.35s}

  .slot{position:absolute;left:18px;top:88px;width:66px;height:86px;border-radius:12px;border:3px solid var(--ink);
    background:linear-gradient(135deg,#f4f4f7,#c9cbd6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:box-shadow .2s}
  .slot-hole{width:9px;height:38px;border-radius:5px;background:var(--ink);box-shadow:inset 0 0 0 2px #000}
  .slot small{font-size:10px;font-weight:900;letter-spacing:1px}
  .slot.flash{animation:slotFlash .6s ease}
  @keyframes slotFlash{0%,100%{box-shadow:0 0 0 0 rgba(123,228,149,0)}30%{box-shadow:0 0 0 6px #7be495,0 0 24px 8px #7be495}}

  .panel{position:absolute;right:18px;top:88px;width:66px;height:86px;border-radius:12px;border:3px solid var(--ink);background:#fffbea;
    display:flex;flex-direction:column;justify-content:center;gap:2px;padding:4px 6px}
  .panel div{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:900}
  .panel i{width:9px;height:9px;border-radius:50%;background:var(--c);border:1.5px solid var(--ink)}

  .crank{position:absolute;left:calc(50% - 48px);top:80px;width:96px;height:96px;border-radius:50%;border:4px solid var(--ink);
    background:radial-gradient(circle at 35% 30%,#ffffff,#cfd2dd 60%,#9fa3b5);cursor:grab;touch-action:none;outline:none}
  .crank:focus-visible{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--ink)}
  .crank:active{cursor:grabbing}
  .crank-handle{position:absolute;left:50%;top:50%;width:84px;height:26px;margin:-13px 0 0 -42px;border-radius:13px;border:3px solid var(--ink);
    background:linear-gradient(180deg,#fff,#ffe3e6 50%,#ffb3bc);will-change:transform}
  .crank-handle::after{content:"";position:absolute;right:6px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--red);border:2px solid var(--ink)}
  .crank-cap{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);pointer-events:none}
  .crank.armed::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px dashed #fff;opacity:.95;
    animation:spin 2.4s linear infinite;box-shadow:0 0 18px rgba(255,255,255,.7)}
  @keyframes spin{to{transform:rotate(360deg)}}

  .chute{position:absolute;left:50%;top:192px;width:124px;height:72px;transform:translateX(-50%);border-radius:14px 14px 32px 32px;
    border:4px solid var(--ink);background:#3a1d26;box-shadow:inset 0 10px 16px rgba(0,0,0,.6);overflow:hidden}
  .chute::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:rgba(255,255,255,.12);border-bottom:3px solid rgba(0,0,0,.4);z-index:2;pointer-events:none}
  .chute.bump{animation:bump .25s ease}
  @keyframes bump{40%{transform:translateX(-50%) translateY(3px) scaleY(.96)}}

  /* ---------- Capsules ---------- */
  .cap{--s:48px;position:absolute;width:var(--s);height:var(--s);border-radius:50%}
  .cap .half{position:absolute;left:0;width:100%;height:50%;border:3px solid var(--ink)}
  .cap .top{top:0;border-bottom:none;border-radius:999px 999px 0 0;
    background:radial-gradient(circle at 30% 45%,rgba(255,255,255,.75) 0 12%,transparent 32%),var(--c)}
  .cap .top::after{content:"";position:absolute;left:-3px;right:-3px;bottom:0;height:3px;background:var(--ink);opacity:.9}
  .cap .bot{bottom:0;border-top:none;border-radius:0 0 999px 999px;
    background:radial-gradient(circle at 70% 30%,rgba(255,255,255,.95) 0 10%,transparent 30%),linear-gradient(180deg,#fffdf7,#e6e1d6)}

  .dome .cap{transform:rotate(var(--r))}
  .dome .cap.jig{animation:jig .38s ease}
  @keyframes jig{30%{transform:translate(var(--jx),var(--jy)) rotate(calc(var(--r) + var(--jr)))}65%{transform:translate(calc(var(--jx) * -.4),calc(var(--jy) * -.3)) rotate(var(--r))}}
  .dome .cap.gone{animation:gone .4s ease-in forwards}
  @keyframes gone{to{transform:translateY(80px) rotate(var(--r)) scale(.4);opacity:0}}
  .dome .cap.fill{animation:fill .7s cubic-bezier(.3,1.4,.5,1) backwards}
  @keyframes fill{from{transform:translateY(-320px) rotate(calc(var(--r) - 120deg))}}

  .out-cap{--s:56px;position:absolute;left:50%;bottom:4px;width:var(--s);height:var(--s);padding:0;border:none;background:none;cursor:pointer;display:none;z-index:1;outline:none;border-radius:50%}
  .out-cap.show{display:block;animation:chuteDrop .75s cubic-bezier(.4,0,.6,1) forwards}
  @keyframes chuteDrop{
    0%{transform:translate(-50%,-100px) rotate(-40deg)}
    55%{transform:translate(-50%,0) rotate(15deg)}
    70%{transform:translate(-50%,-14px) rotate(-6deg)}
    85%{transform:translate(-50%,0) rotate(3deg)}
    93%{transform:translate(-50%,-4px) rotate(0)}
    100%{transform:translate(-50%,0) rotate(0)}}
  .out-cap.ready{animation:invite 1.4s ease-in-out infinite;transform:translate(-50%,0)}
  .out-cap.ready::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid #fff;animation:ring 1.4s ease-out infinite}
  .out-cap:focus-visible::after{content:"";position:absolute;inset:-4px;border-radius:50%;outline:3px solid #fff}
  @keyframes invite{0%,60%,100%{transform:translate(-50%,0) rotate(0)}70%{transform:translate(-50%,-6px) rotate(-10deg)}80%{transform:translate(-50%,0) rotate(8deg)}90%{transform:translate(-50%,-2px) rotate(-3deg)}}
  @keyframes ring{from{transform:scale(.8);opacity:1}to{transform:scale(1.5);opacity:0}}

  /* ---------- Controls under machine ---------- */
  .hint{min-height:28px;font-weight:800;font-size:17px;text-align:center}
  .hint.pop{animation:hintPop .35s cubic-bezier(.3,1.6,.5,1)}
  .hint.warn{color:var(--red)}
  @keyframes hintPop{from{transform:scale(.7);opacity:0}}
  .btn{border:3px solid var(--ink);border-radius:18px;background:var(--yellow);font-weight:900;font-size:18px;padding:12px 22px;cursor:pointer;
    box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s,filter .2s;display:inline-flex;align-items:center;gap:10px}
  .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 0 var(--ink)}
  .btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
  .btn:disabled{filter:grayscale(.8) opacity(.55);cursor:not-allowed}
  .btn.waiting{background:linear-gradient(90deg,var(--yellow) var(--p,0%),#e9e4da var(--p,0%));cursor:not-allowed;font-variant-numeric:tabular-nums}
  .btn.waiting .coin{filter:grayscale(1) opacity(.5)}
  .btn.waiting:hover,.btn.waiting:active{transform:none!important;box-shadow:0 6px 0 var(--ink)!important}
  .btn.ready-pop{animation:readyPop .55s cubic-bezier(.3,1.8,.5,1)!important}
  @keyframes readyPop{30%{transform:scale(1.12)}}
  .machine.cooling .bulb{animation:none;background:#7a5a1a;box-shadow:none}
  .coin{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9,#ffd23f 45%,#e0a100);
    border:3px solid #a86f00;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#8a5a00}
  .coin.flying{position:fixed;left:0;top:0;z-index:70;pointer-events:none}
  .btn.idle-pulse:not(:disabled){animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 6px 0 var(--ink),0 0 0 0 rgba(255,210,63,.7)}50%{box-shadow:0 6px 0 var(--ink),0 0 0 12px rgba(255,210,63,0)}}
  .nudge{animation:nudge .4s ease!important}
  @keyframes nudge{20%{transform:translateX(-7px) rotate(-4deg)}40%{transform:translateX(6px) rotate(3deg)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}

  /* ---------- Sidebar ---------- */
  aside{display:flex;flex-direction:column;gap:16px}
  .card{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:16px;box-shadow:0 6px 0 var(--ink)}
  .card h2{margin:0 0 10px;font-size:14px;letter-spacing:1px;color:var(--muted);font-weight:900}
  .total{position:relative;font-size:44px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .total.bounce{animation:totalBounce .4s cubic-bezier(.3,1.8,.5,1)}
  @keyframes totalBounce{40%{transform:scale(1.15)}}
  .sub{margin-top:6px;color:var(--muted);font-weight:800;font-size:14px}
  .plus{position:absolute;right:0;top:-6px;font-size:22px;font-weight:900;color:var(--c);-webkit-text-stroke:1px var(--ink);animation:plus 1.1s ease-out forwards;pointer-events:none}
  @keyframes plus{from{transform:translateY(10px) scale(.6);opacity:0}20%{transform:translateY(0) scale(1.2);opacity:1}to{transform:translateY(-40px);opacity:0}}
  .tiers{display:flex;flex-direction:column;gap:8px}
  .tier{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:color-mix(in srgb,var(--c) 14%,#fff);border:2px solid color-mix(in srgb,var(--c) 50%,var(--ink))}
  .tier .dot{width:30px;height:30px;border-radius:50%;background:var(--c);border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 0 var(--ink)}
  .tier b{display:block;font-size:16px}
  .tier span{font-size:12px;color:var(--muted);font-weight:800}
  .tier em{font-style:normal;font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
  .tier.bounce{animation:totalBounce .4s cubic-bezier(.3,1.8,.5,1)}
  .history{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
  .history i{width:30px;height:30px;border-radius:50%;background:var(--c);border:2.5px solid var(--ink);font-style:normal;font-size:10px;font-weight:900;color:#fff;
    display:flex;align-items:center;justify-content:center;text-shadow:0 1px 0 var(--ink)}
  .history i:first-child{animation:hintPop .4s cubic-bezier(.3,1.6,.5,1)}
  .history .empty{color:var(--muted);font-weight:800;font-size:14px}
  .link{background:none;border:none;color:var(--muted);font-weight:800;cursor:pointer;text-decoration:underline;padding:0;font-size:13px}

  /* ---------- Reveal overlay ---------- */
  .overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    background:rgba(28,20,40,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .25s;overflow:hidden;padding:16px}
  .overlay.open{opacity:1}
  .rays{position:absolute;left:50%;top:50%;width:1200px;height:1200px;margin:-600px;border-radius:50%;opacity:0;transition:opacity .4s;pointer-events:none;
    background:repeating-conic-gradient(var(--tc,#fff) 0 9deg,transparent 9deg 22deg);
    -webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:spin 14s linear infinite}
  .overlay.rays-on .rays{opacity:.35}
  .reveal-stage{position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center}
  .cap.big{--s:180px;position:relative;cursor:pointer;outline:none;touch-action:manipulation}
  .cap.big .half{border-width:5px}
  .cap.big .top::after{height:5px;left:-5px;right:-5px}
  .cap.big.enter{animation:capIn .5s cubic-bezier(.3,1.6,.5,1)}
  @keyframes capIn{from{transform:scale(.2) rotate(-90deg);opacity:0}}
  .cap.big.wob1{animation:wob .35s ease;--w:1}
  .cap.big.wob2{animation:wob .4s ease;--w:1.8}
  .cap.big.wob3{animation:wob .4s ease;--w:2.6}
  @keyframes wob{
    15%{transform:scale(calc(1 + .05 * var(--w)),calc(1 - .05 * var(--w)))}
    35%{transform:rotate(calc(-6deg * var(--w))) scale(.97)}
    55%{transform:rotate(calc(5deg * var(--w)))}
    75%{transform:rotate(calc(-2deg * var(--w)))}}
  .cap.big.charge{animation:charge .07s linear infinite}
  @keyframes charge{0%{transform:translate(-3px,1px) rotate(-2deg) scale(1.06)}50%{transform:translate(3px,-2px) rotate(2deg) scale(1.1)}100%{transform:translate(-3px,1px) rotate(-2deg) scale(1.06)}}
  .cap.big.leak{filter:drop-shadow(0 0 14px var(--g)) drop-shadow(0 0 34px var(--g))}
  .cracks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;transition:opacity .1s}
  .cracks path{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .18s ease-out}
  .leak .cracks path{stroke:#fff;filter:drop-shadow(0 0 2px var(--g)) drop-shadow(0 0 4px var(--g))}
  [data-crack="1"] .k1,[data-crack="2"] .k1,[data-crack="2"] .k2,[data-crack="3"] path{stroke-dashoffset:0}
  .cap.big.open{animation:none;pointer-events:none}
  .cap.big.open .cracks{opacity:0}
  .cap.big.open .top{animation:flyTop .75s cubic-bezier(.2,.7,.3,1) forwards}
  .cap.big.open .bot{animation:flyBot .75s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes flyTop{to{transform:translate(-150px,-260px) rotate(-70deg);opacity:0}}
  @keyframes flyBot{to{transform:translate(140px,280px) rotate(55deg);opacity:0}}

  .prize{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transform:scale(0);opacity:0;pointer-events:none}
  .prize.show{animation:prizeIn .7s cubic-bezier(.2,1.7,.4,1) forwards}
  @keyframes prizeIn{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
  .prize-stars{font-size:22px;color:var(--tc);letter-spacing:2px;-webkit-text-stroke:1px #fff;text-shadow:0 0 12px var(--tc)}
  .prize-coin{width:170px;height:170px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0 10%,transparent 32%),var(--tc);
    border:6px solid #fff;box-shadow:0 0 0 5px var(--ink),0 0 40px var(--tc),0 0 90px var(--tc);color:#fff;font-weight:900;
    text-shadow:0 3px 0 var(--ink),0 0 2px var(--ink)}
  .prize.show .prize-coin{animation:coinSpin 1.2s .25s ease-out}
  @keyframes coinSpin{0%{transform:rotateY(0)}100%{transform:rotateY(720deg)}}
  .prize-coin .yen{font-size:26px;margin-left:1px;align-self:flex-end;margin-bottom:58px}
  .prize-coin .amt{font-size:54px;letter-spacing:-1px}
  .prize-name{font-size:26px;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 3px 0 var(--ink)}
  .prize-jp{font-size:14px;font-weight:800;color:var(--tc);letter-spacing:3px;margin-top:-6px}
  .tap-hint{margin:0;color:#fff;font-weight:900;font-size:20px;min-height:28px;text-align:center;transition:opacity .2s}
  .tap-hint.pop{animation:hintPop .3s cubic-bezier(.3,1.6,.5,1)}
  .overlay .btn{opacity:0;transform:translateY(20px);pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
  .overlay .btn.show{opacity:1;transform:none;pointer-events:auto}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:55}
  #flash.go{animation:flash .45s ease-out}
  @keyframes flash{0%{opacity:.9}100%{opacity:0}}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:60}

  .shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{
    10%{transform:translate(calc(var(--amp) * -1),calc(var(--amp) * .4))}
    20%{transform:translate(var(--amp),calc(var(--amp) * -.6))}
    30%{transform:translate(calc(var(--amp) * -.8),calc(var(--amp) * -.2))}
    45%{transform:translate(calc(var(--amp) * .6),calc(var(--amp) * .5))}
    60%{transform:translate(calc(var(--amp) * -.4),0)}
    80%{transform:translate(calc(var(--amp) * .2),0)}}

  @media (max-width:760px){
    .app{grid-template-columns:1fr;gap:22px}
    aside{max-width:420px;width:100%;margin:0 auto}
  }
  @media (prefers-reduced-motion:reduce){
    .bulb,.rays,.crank.armed::before,.out-cap.ready,.btn.idle-pulse{animation:none!important}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>ガチャガチャ<small>カプセルトイ・200円〜500円が当たる！</small></h1>
    <button class="icon-btn" id="muteBtn" aria-label="音を消す">🔊</button>
  </header>

  <section class="play">
    <div class="machine" id="machine">
      <div class="dome" id="dome"><div class="glass"></div></div>
      <div class="collar"></div>
      <div class="body">
        <div class="marquee">
          <div class="bulbs t" id="bulbsT"></div>
          <b>ガチャガチャ</b><span>カプセルトイ</span>
          <div class="bulbs b" id="bulbsB"></div>
        </div>
        <div class="slot" id="slot"><div class="slot-hole" id="slotHole"></div><small>投入口</small></div>
        <div class="crank" id="crank" role="button" tabindex="0" aria-label="ハンドルを回す">
          <div class="crank-handle" id="crankHandle"></div>
          <div class="crank-cap"></div>
        </div>
        <div class="panel" id="panel"></div>
        <div class="chute" id="chute">
          <button class="out-cap cap" id="outCap" aria-label="カプセルを取り出す"><div class="half top"></div><div class="half bot"></div></button>
        </div>
      </div>
      <div class="feet"></div>
    </div>

    <div class="hint" id="hint"></div>
    <button class="btn idle-pulse" id="coinBtn"><span class="coin" id="coinIco">円</span><span id="coinLabel">コインを入れる</span></button>
  </section>

  <aside>
    <div class="card">
      <h2>獲得金額</h2>
      <div class="total" id="total">0円</div>
      <div class="sub" id="plays">0回</div>
    </div>
    <div class="card">
      <h2>景品と排出率</h2>
      <div class="tiers" id="tiers"></div>
    </div>
    <div class="card">
      <h2>ガチャ履歴</h2>
      <div class="history" id="history"></div>
      <div style="margin-top:12px"><button class="link" id="resetBtn">記録をリセット</button></div>
    </div>
  </aside>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="rays"></div>
  <div class="reveal-stage" id="stage">
    <div class="cap big" id="bigCap" role="button" tabindex="0" aria-label="タップしてカプセルを開ける">
      <div class="half top"></div><div class="half bot"></div>
      <svg class="cracks" viewBox="0 0 100 100" aria-hidden="true">
        <path class="k1" pathLength="1" d="M50 50 L45 41 L53 34 L47 25 L52 18"/>
        <path class="k2" pathLength="1" d="M50 50 L58 57 L53 65 L62 73 M58 57 L68 53"/>
        <path class="k3" pathLength="1" d="M28 50 L24 41 L32 35 M72 50 L77 42 L71 34 L79 27 M38 50 L34 60 L42 68"/>
      </svg>
    </div>
    <div class="prize" id="prize">
      <div class="prize-stars" id="prizeStars"></div>
      <div class="prize-coin"><span class="amt" id="prizeAmt"></span><span class="yen">円</span></div>
      <div class="prize-name" id="prizeName"></div>
      <div class="prize-jp" id="prizeJp"></div>
    </div>
  </div>
  <p class="tap-hint" id="tapHint"></p>
  <button class="btn" id="collectBtn">Collect</button>
</div>
<div id="flash"></div>
<canvas id="fx"></canvas>

<script>
(() => {
  // ================= Data =================
  const TIERS = [
    // lvl = rarity level (0 = N … 3 = SSR); it drives how big the reveal effects and sounds are.
    { yen: 200, name: 'レア！',         rank: 'R',   jp: 'レア',               lvl: 1, stars: 2, color: '#2fcf7a', weight: 25 },
    { yen: 300, name: 'ゲット！',       rank: 'N',   jp: 'ノーマル',           lvl: 0, stars: 1, color: '#4aa3ff', weight: 37 },
    { yen: 400, name: 'スーパーレア！', rank: 'SR',  jp: 'スーパーレア',       lvl: 2, stars: 3, color: '#a66bff', weight: 24 },
    { yen: 500, name: '大当たり！！',   rank: 'SSR', jp: 'スーパースーパーレア', lvl: 3, stars: 4, color: '#ffb703', weight: 14 },
  ];
  const SHELLS = ['#ff7eb6', '#ffd23f', '#5ec8ff', '#7be495', '#ff9f43', '#b58cff', '#ff6b6b', '#4dd4c6'];
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const KEY = 'gachagacha-v1';
  const COOLDOWN_MS = 60 * 1000;

  const $ = id => document.getElementById(id);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const rand = (a, b) => a + Math.random() * (b - a);
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
  const restart = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

  function load() {
    const def = { total: 0, plays: 0, counts: [0, 0, 0, 0], history: [], muted: false, cooldownUntil: 0 };
    try { return Object.assign(def, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { return def; }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(stats)); } catch (e) {} }
  const stats = load();

  // ================= Sound (Web Audio, all synthesized) =================
  const Sfx = (() => {
    let ctx, master, noiseBuf, muted = false, silentEl = null;
    // iPhone: Web Audio obeys the ring/silent switch unless the page's audio session is "playback".
    // Newer iOS exposes navigator.audioSession; older iOS only switches while an <audio> element is playing.
    function silentWavUrl() {
      const n = 800, b = new Uint8Array(44 + n), v = new DataView(b.buffer);
      const w = (o, str) => { for (let i = 0; i < str.length; i++) b[o + i] = str.charCodeAt(i); };
      w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt ');
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
      w(36, 'data'); v.setUint32(40, n, true); b.fill(128, 44);
      return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
    }
    function primeSession() {
      try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; return; } } catch (e) {}
      try {
        if (!silentEl) {
          silentEl = new Audio(silentWavUrl());
          silentEl.loop = true; silentEl.setAttribute('playsinline', '');
          document.addEventListener('visibilitychange', () => { if (document.hidden) silentEl.pause(); });
        }
        if (silentEl.paused) silentEl.play().catch(() => {});
      } catch (e) {}
    }
    function ac() {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain(); master.gain.value = 0.7;
        const comp = ctx.createDynamicsCompressor();
        master.connect(comp).connect(ctx.destination);
      }
      if (!muted) primeSession();
      if (ctx.state !== 'running') ctx.resume();
      return ctx;
    }
    function tone({ freq = 440, to = null, type = 'sine', dur = 0.15, vol = 0.3, delay = 0, attack = 0.005 }) {
      if (muted) return;
      const c = ac(), t = c.currentTime + delay;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
    }
    function noise({ dur = 0.05, vol = 0.3, delay = 0, type = 'bandpass', freq = 2000, to = null, q = 1 }) {
      if (muted) return;
      const c = ac(), t = c.currentTime + delay;
      if (!noiseBuf) {
        noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      const s = c.createBufferSource(); s.buffer = noiseBuf;
      const f = c.createBiquadFilter(); f.type = type; f.Q.value = q;
      f.frequency.setValueAtTime(freq, t);
      if (to) f.frequency.exponentialRampToValueAtTime(to, t + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f).connect(g).connect(master); s.start(t, Math.random() * 0.4); s.stop(t + dur + 0.05);
    }
    return {
      unlock: ac,
      setMuted(m) { muted = m; if (m && silentEl) silentEl.pause(); },
      coin() {
        tone({ freq: 2093, dur: 0.3, vol: 0.22 }); tone({ freq: 3136, dur: 0.4, vol: 0.12, delay: 0.03 });
        for (let i = 0; i < 4; i++) noise({ dur: 0.03, vol: 0.22 - i * 0.04, freq: 3800, q: 4, delay: 0.22 + i * 0.07 + Math.random() * 0.02 });
        tone({ freq: 1400, to: 1100, dur: 0.1, vol: 0.08, delay: 0.24, type: 'triangle' });
      },
      flick() { noise({ dur: 0.18, vol: 0.15, freq: 900, to: 4000, q: 2 }); },
      click(i) {
        noise({ dur: 0.04, vol: 0.55, freq: 1600 + i * 220, q: 5 });
        tone({ freq: 140 + i * 15, type: 'square', dur: 0.05, vol: 0.08 });
      },
      rattle(n = 7, span = 0.3) {
        for (let i = 0; i < n; i++) noise({ dur: 0.025, vol: 0.18, freq: rand(2200, 4500), q: 6, delay: Math.random() * span });
      },
      thud(v = 1) {
        tone({ freq: 170, to: 55, dur: 0.2, vol: 0.55 * v });
        noise({ dur: 0.07, vol: 0.25 * v, type: 'lowpass', freq: 900 });
      },
      plink(v = 1) { tone({ freq: 950, to: 620, dur: 0.09, vol: 0.18 * v, type: 'triangle' }); },
      clunk() {
        tone({ freq: 120, to: 80, type: 'square', dur: 0.12, vol: 0.1 });
        noise({ dur: 0.06, vol: 0.2, type: 'lowpass', freq: 600 });
      },
      whoosh() { noise({ dur: 0.35, vol: 0.25, freq: 300, to: 3000, q: 1.5 }); tone({ freq: 300, to: 900, dur: 0.3, vol: 0.06 }); },
      tap(n) {
        noise({ dur: 0.07, vol: 0.45, type: 'highpass', freq: 2200 + n * 700 });
        tone({ freq: 480 + n * 170, to: 300 + n * 110, type: 'triangle', dur: 0.12, vol: 0.22 });
        if (n >= 2) noise({ dur: 0.12, vol: 0.2, freq: 5000, q: 8, delay: 0.03 });
      },
      shimmer(color) {
        for (let i = 0; i < 8; i++) tone({ freq: rand(2500, 5000), dur: 0.15, vol: 0.04, delay: i * 0.04 });
      },
      charge(dur) {
        tone({ freq: 180, to: 1400, type: 'sawtooth', dur, vol: 0.07, attack: dur * 0.9 });
        tone({ freq: 360, to: 2800, type: 'sine', dur, vol: 0.06, attack: dur * 0.9 });
      },
      pop() {
        tone({ freq: 260, to: 1500, dur: 0.16, vol: 0.4 });
        noise({ dur: 0.25, vol: 0.4, type: 'highpass', freq: 2500 });
        tone({ freq: 90, to: 40, dur: 0.25, vol: 0.4 });
      },
      fanfare(tier) {
        const seqs = [
          [523.25, 659.25, 783.99],
          [523.25, 659.25, 783.99, 1046.5],
          [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568],
          [392, 523.25, 659.25, 783.99, 1046.5, 1318.5, 1568, 2093],
        ];
        const seq = seqs[tier], step = tier === 3 ? 0.07 : 0.09;
        seq.forEach((f, i) => {
          tone({ freq: f, type: 'triangle', dur: 0.25, vol: 0.2, delay: i * step });
          tone({ freq: f * 2, type: 'square', dur: 0.07, vol: 0.025, delay: i * step });
        });
        const end = seq.length * step, hold = 0.6 + tier * 0.35;
        [523.25, 659.25, 783.99, 1046.5].forEach(f => {
          tone({ freq: f, type: 'triangle', dur: hold, vol: 0.09, delay: end });
          if (tier >= 2) tone({ freq: f * 1.003, type: 'sawtooth', dur: hold, vol: 0.015, delay: end });
        });
        if (tier >= 2) for (let i = 0; i < 10 + tier * 8; i++) tone({ freq: rand(2000, 5200), dur: 0.12, vol: 0.045, delay: end + Math.random() * hold });
        if (tier === 3) [1046.5, 1318.5, 1568, 2093].forEach((f, i) => tone({ freq: f, type: 'square', dur: 0.12, vol: 0.04, delay: end + hold + i * 0.06 }));
      },
      collect(tier) {
        for (let i = 0; i < tier + 3; i++) tone({ freq: rand(1800, 2700), dur: 0.18, vol: 0.12, delay: i * 0.06 });
      },
      ready() {
        [783.99, 1046.5, 1568].forEach((f, i) => tone({ freq: f, type: 'triangle', dur: 0.3, vol: 0.18, delay: i * 0.09 }));
      },
      countdown() { tone({ freq: 660, type: 'sine', dur: 0.08, vol: 0.08 }); },
      tick(i) { tone({ freq: 900 + i * 35, type: 'square', dur: 0.03, vol: 0.045 }); },
    };
  })();

  // ================= Particles =================
  const fx = (() => {
    const cv = $('fx'), c = cv.getContext('2d');
    let W, H, parts = [], running = false;
    function resize() {
      const dpr = Math.min(2, devicePixelRatio || 1);
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener('resize', resize); resize();
    function draw(p) {
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
      c.globalAlpha = Math.min(1, p.life / 25);
      c.fillStyle = p.color;
      const s = p.size;
      switch (p.shape) {
        case 'rect': c.scale(1, Math.cos(p.t += 0.18)); c.fillRect(-s / 2, -s / 4, s, s / 2); break;
        case 'circle': c.beginPath(); c.arc(0, 0, s / 2, 0, 7); c.fill(); break;
        case 'star':
          c.beginPath();
          for (let i = 0; i < 8; i++) { const r = i % 2 ? s * 0.22 : s; const a = i * Math.PI / 4; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
          c.closePath(); c.fill(); break;
        case 'shard':
          c.beginPath(); c.moveTo(-s / 2, -s / 3); c.lineTo(s / 2, -s / 2); c.lineTo(0, s / 2); c.closePath(); c.fill();
          c.strokeStyle = '#2b2d42'; c.lineWidth = 1.5; c.stroke(); break;
        case 'coin':
          c.scale(Math.cos(p.t += 0.12), 1);
          c.beginPath(); c.arc(0, 0, s / 2, 0, 7); c.fillStyle = '#ffd23f'; c.fill();
          c.lineWidth = 2.5; c.strokeStyle = '#a86f00'; c.stroke();
          c.beginPath(); c.arc(0, 0, s / 3.2, 0, 7); c.strokeStyle = '#e0a100'; c.lineWidth = 1.5; c.stroke();
          break;
      }
      c.restore();
    }
    function loop() {
      c.clearRect(0, 0, W, H);
      parts = parts.filter(p => {
        p.vx *= p.drag; p.vy = p.vy * p.drag + p.g;
        p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
        if (p.life <= 0 || p.y > H + 60) return false;
        draw(p); return true;
      });
      if (parts.length) requestAnimationFrame(loop); else { running = false; c.clearRect(0, 0, W, H); }
    }
    function add(p) {
      const o = Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0.25, drag: 0.985, rot: 0, vr: 0, life: 100, size: 8, color: '#fff', shape: 'rect', t: Math.random() * 6 }, p);
      parts.push(o);
      if (!running) { running = true; requestAnimationFrame(loop); }
    }
    function burst(x, y, { n = 30, colors = ['#fff'], speed = 8, shapes = ['rect', 'circle'], g = 0.25, life = 90, size = [6, 12], spread = Math.PI * 2, angle = -Math.PI / 2 } = {}) {
      if (RM) n = Math.ceil(n * 0.35);
      for (let i = 0; i < n; i++) {
        const a = angle + (Math.random() - 0.5) * spread, s = speed * rand(0.35, 1.2);
        add({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g, life: life * rand(0.7, 1.3), size: rand(size[0], size[1]),
          color: pick(colors), shape: pick(shapes), rot: Math.random() * 6, vr: rand(-0.3, 0.3) });
      }
    }
    function coinRain(ms = 1800, n = 45) {
      if (RM) n = 12;
      for (let i = 0; i < n; i++) setTimeout(() => add({ x: rand(0, W), y: -30, vx: rand(-1, 1), vy: rand(2, 5), g: 0.18, drag: 0.995,
        shape: 'coin', size: rand(18, 30), life: 260 }), Math.random() * ms);
    }
    return { burst, coinRain, add };
  })();

  // ================= DOM refs =================
  const app = $('app'), machine = $('machine'), dome = $('dome'), slot = $('slot'), slotHole = $('slotHole');
  const crank = $('crank'), crankHandle = $('crankHandle'), chute = $('chute'), outCap = $('outCap');
  const hint = $('hint'), coinBtn = $('coinBtn'), coinIco = $('coinIco'), coinLabel = $('coinLabel');
  const overlay = $('overlay'), stage = $('stage'), bigCap = $('bigCap'), prize = $('prize'), tapHint = $('tapHint'), collectBtn = $('collectBtn');

  // Marquee bulbs + mini prize panel + sidebar tiers
  ['bulbsT', 'bulbsB'].forEach((id, k) => {
    for (let i = 0; i < 12; i++) { const b = document.createElement('i'); b.className = 'bulb'; b.style.setProperty('--i', k ? 11 - i : i); $(id).append(b); }
  });
  $('panel').innerHTML = TIERS.slice().reverse().map(t => `<div><i style="--c:${t.color}"></i>${t.yen}円</div>`).join('');
  $('tiers').innerHTML = TIERS.slice().reverse().map((t, ri) => {
    const i = TIERS.length - 1 - ri;
    return `<div class="tier" id="tier${i}" style="--c:${t.color}"><div class="dot">${t.rank}</div>
      <div><b>${t.yen}円</b><span>${t.rank}・${t.jp}・${t.weight}%</span></div><em id="cnt${i}">×0</em></div>`;
  }).join('');

  // ================= Dome capsules =================
  const ROWS = [ { y: 244, n: 3 }, { y: 206, n: 5 }, { y: 168, n: 6 }, { y: 130, n: 6 }, { y: 94, n: 4 } ];
  const SLOTS = [];
  ROWS.forEach(r => {
    const hc = Math.sqrt(116 * 116 - (r.y - 144) ** 2);
    for (let i = 0; i < r.n; i++) {
      const x = r.n === 1 ? 144 : 144 - hc + (2 * hc) * (i / (r.n - 1));
      SLOTS.push({ x, y: r.y });
    }
  });
  let domeCaps = [];
  function makeDomeCap(slotPos, animate, delay = 0) {
    const el = document.createElement('div');
    el.className = 'cap' + (animate ? ' fill' : '');
    el.innerHTML = '<div class="half top"></div><div class="half bot"></div>';
    el.style.setProperty('--c', pick(SHELLS));
    el.style.setProperty('--r', rand(-180, 180) + 'deg');
    el.style.left = (slotPos.x - 24 + rand(-6, 6)) + 'px';
    el.style.top = (slotPos.y - 24 + rand(-5, 5)) + 'px';
    if (animate) el.style.animationDelay = delay + 's';
    dome.insertBefore(el, dome.querySelector('.glass'));
    return el;
  }
  function fillDome(animate) {
    const start = domeCaps.length;
    for (let i = start; i < SLOTS.length; i++) domeCaps.push(makeDomeCap(SLOTS[i], animate, (i - start) * 0.05));
    if (animate) {
      Sfx.rattle(18, 0.9 + (SLOTS.length - start) * 0.03);
      setTimeout(() => domeCaps.forEach(el => el.classList.remove('fill')), 1600);
    }
  }
  function jiggleDome(strength = 1) {
    domeCaps.forEach(el => {
      el.style.setProperty('--jx', rand(-5, 5) * strength + 'px');
      el.style.setProperty('--jy', rand(-8, 2) * strength + 'px');
      el.style.setProperty('--jr', rand(-25, 25) * strength + 'deg');
      restart(el, 'jig');
    });
    Sfx.rattle(4, 0.15);
  }
  function takeDomeCap() {
    const el = domeCaps.pop();
    if (!el) return;
    el.classList.remove('jig'); el.classList.add('gone');
    setTimeout(() => el.remove(), 450);
  }

  // ================= Game state =================
  let state = 'idle';             // idle → coin → ready → dropping → dropped → revealing → revealed → cooldown → idle
  let current = null, taps = 0, crankAngle = 0, clicksDone = 0, dragging = false, lastAng = 0, moved = 0;

  const HINTS = {
    idle: 'コインを入れてね 🪙',
    coin: '…',
    ready: 'ハンドルを右に回してね ↻（タップでもOK）',
    turning: 'ガチャ…ガチャ…',
    dropping: '出てくるよ！',
    dropped: 'カプセルが出たよ！取り出し口からとってね ✋',
    revealing: '',
    revealed: '',
    cooldown: '次のガチャまで少し待ってね ⏳',
  };
  function setHint(text = HINTS[state], warn = false) {
    hint.textContent = text;
    hint.classList.toggle('warn', warn);
    restart(hint, 'pop');
  }
  function syncUI() {
    coinBtn.disabled = state !== 'idle' && state !== 'cooldown';
    coinBtn.classList.toggle('waiting', state === 'cooldown');
    coinBtn.classList.toggle('idle-pulse', state === 'idle');
    crank.classList.toggle('armed', state === 'ready');
    machine.classList.toggle('hot', state !== 'idle' && state !== 'cooldown');
    machine.classList.toggle('cooling', state === 'cooldown');
  }
  function go(s) { state = s; syncUI(); setHint(); }

  function nudge(el, msg) {
    Sfx.clunk(); buzz([10, 40, 10]);
    restart(el, 'nudge');
    setTimeout(() => el.classList.remove('nudge'), 420);
    if (msg) setHint(msg, true);
  }

  // ---- 1. Coin ----
  function insertCoin() {
    if (state === 'cooldown') return nudge(coinBtn, `あと${secondsLeft()}秒待ってね！⏳`);
    if (state !== 'idle') return;
    Sfx.unlock();
    go('coin');
    const from = coinIco.getBoundingClientRect(), to = slotHole.getBoundingClientRect();
    const sx = from.left + from.width / 2, sy = from.top + from.height / 2;
    const tx = to.left + to.width / 2, ty = to.top + to.height / 2;
    const mx = (sx + tx) / 2, my = Math.min(sy, ty) - 110;
    const el = document.createElement('div');
    el.className = 'coin flying'; el.textContent = '円';
    document.body.append(el);
    Sfx.flick(); buzz(8);
    el.animate([
      { transform: `translate(${sx}px,${sy}px) translate(-50%,-50%) rotate(0deg) scale(1)` },
      { transform: `translate(${mx}px,${my}px) translate(-50%,-50%) rotate(300deg) scale(1.35)`, offset: 0.5 },
      { transform: `translate(${tx}px,${ty - 24}px) translate(-50%,-50%) rotate(450deg) scale(1)`, offset: 0.82 },
      { transform: `translate(${tx}px,${ty}px) translate(-50%,-50%) rotate(450deg) scale(.15,.8)`, opacity: 0 },
    ], { duration: RM ? 250 : 650, easing: 'cubic-bezier(.3,.5,.4,1)', fill: 'forwards' });
    setTimeout(() => {
      el.remove();
      Sfx.coin(); buzz(25);
      restart(slot, 'flash');
      fx.burst(tx, ty, { n: 14, colors: ['#ffd23f', '#fff6c9', '#7be495'], shapes: ['star'], speed: 4, g: 0.05, life: 40, size: [4, 9] });
      go('ready');
    }, RM ? 250 : 650);
  }

  // ---- 2. Crank ----
  function setCrank(a) {
    crankAngle = Math.min(a, 360);
    crankHandle.style.transform = `rotate(${crankAngle}deg)`;
    const steps = Math.floor(crankAngle / 90);
    while (clicksDone < steps) {
      clicksDone++;
      Sfx.click(clicksDone); buzz(12);
      jiggleDome(clicksDone === 4 ? 1.3 : 0.6);
    }
    if (crankAngle >= 360 && (state === 'ready' || state === 'turning')) release();
  }
  function autoTurn() {
    if (state !== 'ready') return crankBlocked();
    state = 'turning'; setHint();
    const start = crankAngle, t0 = performance.now(), dur = RM ? 300 : Math.max(350, (360 - start) / 360 * 1100);
    const ease = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    (function f(now) {
      const k = Math.min(1, (now - t0) / dur);
      setCrank(start + (360 - start) * ease(k));
      if (k < 1 && state === 'turning') requestAnimationFrame(f);
    })(t0);
  }
  function crankBlocked() {
    if (state === 'idle') nudge(crank, '先にコインを入れてね！🪙');
    else if (state === 'dropped') nudge(crank, '先にカプセルをとってね！✋');
    else if (state === 'cooldown') nudge(crank, `あと${secondsLeft()}秒待ってね！⏳`);
  }
  const angleOf = e => {
    const r = crank.getBoundingClientRect();
    return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
  };
  crank.addEventListener('pointerdown', e => {
    if (state !== 'ready') { crankBlocked(); return; }
    Sfx.unlock();
    crank.setPointerCapture(e.pointerId);
    dragging = true; moved = 0; lastAng = angleOf(e);
  });
  crank.addEventListener('pointermove', e => {
    if (!dragging || state !== 'ready') return;
    const a = angleOf(e);
    let d = a - lastAng;
    if (d > 180) d -= 360; if (d < -180) d += 360;
    lastAng = a;
    moved += Math.abs(d);
    if (d > 0) setCrank(crankAngle + d);   // ratchet: only clockwise counts
  });
  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    if (moved < 8 && state === 'ready') autoTurn();
  };
  crank.addEventListener('pointerup', endDrag);
  crank.addEventListener('pointercancel', () => { dragging = false; });

  // ---- 3. Drop ----
  function pickTier() {
    const total = TIERS.reduce((s, t) => s + t.weight, 0);
    let r = Math.random() * total;
    for (let i = 0; i < TIERS.length; i++) { r -= TIERS[i].weight; if (r < 0) return i; }
    return 0;
  }
  function release() {
    dragging = false;
    crankAngle = 0; clicksDone = 0;
    crankHandle.style.transform = 'rotate(0deg)';
    current = { tier: pickTier(), shell: pick(SHELLS) };
    go('dropping');
    takeDomeCap();
    Sfx.rattle(8, 0.35);
    setTimeout(() => {
      outCap.style.setProperty('--c', current.shell);
      outCap.classList.remove('ready');
      restart(outCap, 'show');
      setTimeout(() => { Sfx.thud(1); buzz(35); restart(chute, 'bump'); }, 410);
      setTimeout(() => Sfx.plink(0.7), 530);
      setTimeout(() => Sfx.plink(0.35), 690);
      setTimeout(() => { outCap.classList.add('ready'); go('dropped'); }, 780);
    }, 280);
  }

  // ---- 4. Reveal ----
  function openReveal() {
    if (state !== 'dropped') return;
    taps = 0;
    outCap.classList.remove('show', 'ready');
    bigCap.className = 'cap big enter';
    bigCap.dataset.crack = 0;
    bigCap.style.setProperty('--c', current.shell);
    bigCap.style.setProperty('--g', TIERS[current.tier].color);
    prize.classList.remove('show');
    collectBtn.classList.remove('show');
    overlay.classList.remove('rays-on');
    overlay.hidden = false;
    requestAnimationFrame(() => overlay.classList.add('open'));
    tapHint.textContent = 'タップしてカプセルを開けよう！'; restart(tapHint, 'pop');
    Sfx.whoosh(); buzz(10);
    go('revealing');
    setTimeout(() => bigCap.focus({ preventScroll: true }), 60);
  }
  function capCenter() {
    const r = bigCap.getBoundingClientRect();
    return [r.left + r.width / 2, r.top + r.height / 2];
  }
  function tapCap() {
    if (state !== 'revealing' || taps >= 3) return;
    taps++;
    const tier = TIERS[current.tier].lvl;
    Sfx.tap(taps); buzz(18 * taps);
    bigCap.classList.remove('enter', 'wob1', 'wob2', 'wob3');
    void bigCap.offsetWidth;
    bigCap.classList.add('wob' + taps);
    bigCap.dataset.crack = taps;
    const [cx, cy] = capCenter();
    fx.burst(cx, cy, { n: 5 * taps, colors: [current.shell, '#fffdf7'], shapes: ['shard'], speed: 5 + taps * 2, size: [6, 12], life: 60 });
    if (taps === 2 && tier >= 2) { bigCap.classList.add('leak'); Sfx.shimmer(); }
    tapHint.textContent = taps === 1 ? 'もう一回！' : taps === 2 ? (tier >= 2 ? '光ってる…！？ あと一回！' : 'あと一回！') : '';
    restart(tapHint, 'pop');
    if (taps === 3) {
      const delay = RM ? 100 : [140, 220, 450, 800][tier];
      if (tier >= 2) { bigCap.classList.add('charge'); Sfx.charge(delay / 1000); buzz([30, 30, 30, 30, 60]); }
      setTimeout(burstOpen, delay);
    }
  }
  function burstOpen() {
    const t = TIERS[current.tier], tier = t.lvl;
    const [cx, cy] = capCenter();
    Sfx.pop(); buzz(tier >= 2 ? [60, 40, 120] : 40);
    bigCap.classList.remove('charge', 'wob3');
    bigCap.classList.add('open');
    restart($('flash'), 'go');

    overlay.style.setProperty('--tc', t.color);
    $('prizeAmt').textContent = t.yen;
    $('prizeStars').textContent = '★'.repeat(t.stars);
    $('prizeName').textContent = t.name;
    $('prizeJp').textContent = `${t.rank}・${t.jp}`;
    prize.style.setProperty('--tc', t.color);
    restart(prize, 'show');
    overlay.classList.add('rays-on');

    const colors = [t.color, '#ffffff', '#ffd23f', current.shell];
    fx.burst(cx, cy, { n: [45, 70, 110, 170][tier], colors, speed: 9 + tier * 2.5, life: 110 });
    fx.burst(cx, cy, { n: [8, 14, 24, 40][tier], colors: ['#fff', t.color], shapes: ['star'], speed: 6 + tier, g: 0.04, life: 70, size: [8, 16] });
    fx.burst(cx, cy, { n: 10, colors: [current.shell, '#fffdf7'], shapes: ['shard'], speed: 10, size: [10, 18] });
    if (tier >= 2) shake(tier === 3 ? 14 : 7);
    if (tier === 3) {
      fx.coinRain();
      setTimeout(() => fx.burst(cx - 120, cy + 40, { n: 60, colors, speed: 13, angle: -Math.PI / 3, spread: 0.9 }), 350);
      setTimeout(() => fx.burst(cx + 120, cy + 40, { n: 60, colors, speed: 13, angle: -Math.PI * 2 / 3, spread: 0.9 }), 500);
    }
    setTimeout(() => Sfx.fanfare(tier), 110);
    tapHint.textContent = '';
    setTimeout(() => {
      collectBtn.innerHTML = `<span class="coin">円</span>${t.yen}円を受け取る`;
      collectBtn.classList.add('show');
      go('revealed');
      collectBtn.focus({ preventScroll: true });
    }, 750);
  }
  function shake(amp) {
    if (RM) return;
    [app, stage].forEach(el => { el.style.setProperty('--amp', amp + 'px'); restart(el, 'shake'); });
  }

  // ---- 5. Collect ----
  function collect() {
    if (state !== 'revealed') return;
    const tier = current.tier, t = TIERS[tier];
    overlay.classList.remove('open');
    setTimeout(() => { overlay.hidden = true; bigCap.className = 'cap big'; }, 260);

    const old = stats.total;
    stats.total += t.yen; stats.plays++; stats.counts[tier]++;
    stats.history.unshift(tier); stats.history = stats.history.slice(0, 14);
    save();

    Sfx.collect(t.lvl); buzz(20);
    countUp(old, stats.total);
    const plus = document.createElement('div');
    plus.className = 'plus'; plus.textContent = '+' + t.yen + '円'; plus.style.setProperty('--c', t.color);
    $('total').append(plus); setTimeout(() => plus.remove(), 1150);
    renderStats(false);
    restart($('tier' + tier), 'bounce');

    stats.cooldownUntil = Date.now() + COOLDOWN_MS; save();
    startCooldown();
    if (domeCaps.length <= 8) setTimeout(() => fillDome(true), 500);
  }

  // ---- 6. Cooldown ----
  let cdTimer = null, lastSec = -1;
  const secondsLeft = () => Math.max(0, Math.ceil((stats.cooldownUntil - Date.now()) / 1000));
  function startCooldown() {
    // Never wait longer than one cooldown, even if the device clock was moved backwards.
    stats.cooldownUntil = Math.min(stats.cooldownUntil, Date.now() + COOLDOWN_MS);
    if (secondsLeft() <= 0) { coinLabel.textContent = 'コインを入れる'; go('idle'); return; }
    go('cooldown');
    lastSec = -1;
    clearInterval(cdTimer);
    cdTimer = setInterval(updateCooldown, 200);
    updateCooldown();
  }
  function updateCooldown() {
    stats.cooldownUntil = Math.min(stats.cooldownUntil, Date.now() + COOLDOWN_MS);
    const left = stats.cooldownUntil - Date.now(), sec = secondsLeft();
    coinBtn.style.setProperty('--p', (100 - Math.max(0, left) / COOLDOWN_MS * 100) + '%');
    if (sec !== lastSec) {
      lastSec = sec;
      coinLabel.textContent = `あと ${sec}秒`;
      if (sec > 0 && sec <= 5) { Sfx.countdown(); restart(coinBtn, 'ready-pop'); }
    }
    if (left <= 0) endCooldown();
  }
  function endCooldown() {
    clearInterval(cdTimer); cdTimer = null;
    coinBtn.style.removeProperty('--p');
    coinLabel.textContent = 'コインを入れる';
    go('idle');
    setHint('準備OK！コインを入れてね 🪙');
    Sfx.ready(); buzz([15, 40, 15]);
    restart(coinBtn, 'ready-pop');
    const r = coinBtn.getBoundingClientRect();
    fx.burst(r.left + r.width / 2, r.top + r.height / 2, { n: 16, colors: ['#ffd23f', '#fff6c9', '#ffffff'], shapes: ['star'], speed: 5, g: 0.05, life: 45, size: [5, 10] });
  }
  function countUp(from, to) {
    const el = $('total'), t0 = performance.now(), dur = 650;
    let lastStep = -1;
    restart(el, 'bounce');
    (function f(now) {
      const k = Math.min(1, (now - t0) / dur);
      const v = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
      setTotalText(v);
      const step = Math.floor((v - from) / 25);
      if (step !== lastStep) { lastStep = step; Sfx.tick(step); }
      if (k < 1) requestAnimationFrame(f);
    })(t0);
  }
  function setTotalText(v) {
    const el = $('total');
    el.firstChild && el.firstChild.nodeType === 3 ? (el.firstChild.nodeValue = v.toLocaleString('ja-JP') + '円') : el.prepend(v.toLocaleString('ja-JP') + '円');
  }
  function renderStats(withTotal = true) {
    if (withTotal) setTotalText(stats.total);
    $('plays').textContent = `${stats.plays}回` + (stats.plays ? `・平均 ${Math.round(stats.total / stats.plays)}円` : '');
    TIERS.forEach((t, i) => $('cnt' + i).textContent = '×' + stats.counts[i]);
    $('history').innerHTML = stats.history.length
      ? stats.history.map(i => `<i style="--c:${TIERS[i].color}">${TIERS[i].yen}</i>`).join('')
      : '<span class="empty">まだ回していません</span>';
  }

  // ================= Wiring =================
  // Any touch (re)wakes audio — iOS suspends it after app switches or screen lock.
  ['pointerdown', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (!stats.muted) Sfx.unlock(); }, { passive: true }));
  coinBtn.addEventListener('click', insertCoin);
  outCap.addEventListener('click', openReveal);
  bigCap.addEventListener('pointerdown', e => { e.preventDefault(); tapCap(); });
  collectBtn.addEventListener('click', collect);
  slot.addEventListener('click', () => state === 'idle' ? insertCoin() : null);

  addEventListener('keydown', e => {
    if (e.key !== ' ' && e.key !== 'Enter') return;
    if (e.target.closest('button')) return;
    e.preventDefault();
    if (e.repeat) return;
    ({ idle: insertCoin, cooldown: insertCoin, ready: autoTurn, dropped: openReveal, revealing: tapCap, revealed: collect }[state] || (() => {}))();
  });

  const muteBtn = $('muteBtn');
  function applyMute() {
    Sfx.setMuted(stats.muted);
    muteBtn.textContent = stats.muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', stats.muted ? '音を出す' : '音を消す');
  }
  muteBtn.addEventListener('click', () => {
    stats.muted = !stats.muted; save(); applyMute();
    if (!stats.muted) { Sfx.unlock(); Sfx.plink(1); }
  });

  $('resetBtn').addEventListener('click', () => {
    if (!confirm('獲得金額と履歴をリセットしますか？')) return;
    Object.assign(stats, { total: 0, plays: 0, counts: [0, 0, 0, 0], history: [] });
    save(); renderStats(); Sfx.clunk();
  });

  // ================= Init =================
  fillDome(false);
  applyMute();
  renderStats();
  startCooldown();
})();
</script>
</body>
</html>
